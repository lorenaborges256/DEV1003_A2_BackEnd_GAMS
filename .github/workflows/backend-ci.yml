
name: Build and Push Docker Image

on:
  push:
    branches:
      - feature/add-docker-workflow
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_container:
    name: Test, Build and Publish Container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: 5000
          NODE_ENV: development
        run: npm test -- --runInBand

      - name: Get application version
        run: |
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Get short Git commit SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/lorenaborges256/dev1003_a2_backend_gams:latest
            ghcr.io/lorenaborges256/dev1003_a2_backend_gams:development
            ghcr.io/lorenaborges256/dev1003_a2_backend_gams:testing
            ghcr.io/lorenaborges256/dev1003_a2_backend_gams:production
            ghcr.io/lorenaborges256/dev1003_a2_backend_gams:${{ env.APP_VERSION }}
            ghcr.io/lorenaborges256/dev1003_a2_backend_gams:production-${{ env.APP_VERSION }}
            ghcr.io/lorenaborges256/dev1003_a2_backend_gams:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
